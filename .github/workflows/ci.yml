name: ci
on:
  workflow_dispatch:
  push:
    branches:
      - '6.x'
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    name: ci
    uses: craftcms/.github/.github/workflows/ci.yml@v3
    with:
      craft_version: '6'
      jobs: '["prettier"]'
      notify_slack: true
      slack_subteam: <!subteam^S01CWPYH9D5>
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
      slack_webhook_url: ${{ secrets.SLACK_COMMERCE_WEBHOOK_URL }}
  tests:
    name: Pint, PHPStan and Pest (PHP 8.5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
      - run: composer install --no-interaction --prefer-dist
      - run: composer check-cs
      # In the shared PHPStan job, Larastan doesn't see Craft's query and request macros (Builder::whereParam(),
      # Request::craftPath() and so on), though the same lock passes locally. This job already boots Craft for Pest.
      - run: composer phpstan
      - run: composer test
